[project]
name = "sklearn-assistant"
version = "0.1.0"
description = "Documentation assistant for scikit-learn (RAG + LangGraph)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=2.3",
    "beautifulsoup4>=4.12",
    "chromadb>=1.5",
    "joblib>=1.3",
    "langgraph>=1.2",
    "lxml>=5.0",
    "mlflow>=3.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "sentence-transformers>=6.0",
    "torch>=2.4",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
